services:
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    container_name: self-hosted-anubis
    environment:
      # Runtime only (not available in botPolicy.yaml)
      BIND: ":8923"
      # nginx backend HTTP routing (root compose)
      TARGET: "http://nginx:8080"
      COOKIE_SECURE: "${ANUBIS_COOKIE_SECURE:-true}"
      POLICY_FNAME: "/data/cfg/botPolicy.yaml"
    volumes:
      - ./botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

networks:
  self-hosted:
    name: self-hosted
