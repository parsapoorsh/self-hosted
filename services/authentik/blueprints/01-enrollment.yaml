# Open self-registration (username + password + name), then login.
# Linked from the default identification stage so the login page shows "Sign up".
version: 1
metadata:
  name: self-hosted - Enrollment
entries:
  - identifiers:
      slug: default-enrollment-flow
    model: authentik_flows.flow
    id: flow
    attrs:
      name: Self-hosted enrollment
      title: Create an account
      designation: enrollment
      authentication: require_unauthenticated

  - id: prompt-field-username
    model: authentik_stages_prompt.prompt
    identifiers:
      name: self-hosted-enrollment-field-username
    attrs:
      field_key: username
      label: Username
      type: username
      required: true
      placeholder: Username
      placeholder_expression: false
      order: 0

  - identifiers:
      name: self-hosted-enrollment-field-password
    id: prompt-field-password
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password
      label: Password
      type: password
      required: true
      placeholder: Password
      placeholder_expression: false
      order: 0

  - identifiers:
      name: self-hosted-enrollment-field-password-repeat
    id: prompt-field-password-repeat
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: password_repeat
      label: Password (repeat)
      type: password
      required: true
      placeholder: Password (repeat)
      placeholder_expression: false
      order: 1

  # Hidden display name: signup asks for the name once (the username).
  - identifiers:
      name: self-hosted-enrollment-field-name
    id: prompt-field-name
    model: authentik_stages_prompt.prompt
    attrs:
      field_key: name
      label: Name
      type: hidden
      required: false
      # Hidden fields use their placeholder as the value sent by the client.
      placeholder: ""
      placeholder_expression: false
      order: 2

  # Copy the username into the display name before user_write runs.
  - identifiers:
      name: self-hosted-enrollment-name-from-username
    id: policy-name-from-username
    model: authentik_policies_expression.expressionpolicy
    attrs:
      name: self-hosted-enrollment-name-from-username
      expression: |
        prompt_data = request.context.get("prompt_data", {})
        if not prompt_data.get("name"):
            prompt_data["name"] = prompt_data.get("username", "")
        return True

  - identifiers:
      name: self-hosted-enrollment-prompt-first
    id: default-enrollment-prompt-first
    model: authentik_stages_prompt.promptstage
    attrs:
      fields:
        - !KeyOf prompt-field-username
        - !KeyOf prompt-field-password
        - !KeyOf prompt-field-password-repeat
        - !KeyOf prompt-field-name
      validation_policies:
        - !KeyOf policy-name-from-username

  - identifiers:
      name: self-hosted-enrollment-user-write
    id: default-enrollment-user-write
    model: authentik_stages_user_write.userwritestage
    attrs:
      user_creation_mode: always_create
      # 2026.x defaults user_type to external, which locks enrolled users out of
      # the user interface ("Interface can only be accessed by internal users").
      user_type: internal

  - identifiers:
      name: self-hosted-enrollment-user-login
    id: default-enrollment-user-login
    model: authentik_stages_user_login.userloginstage

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-enrollment-prompt-first
      order: 10
    model: authentik_flows.flowstagebinding

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-enrollment-user-write
      order: 20
    model: authentik_flows.flowstagebinding

  - identifiers:
      target: !KeyOf flow
      stage: !KeyOf default-enrollment-user-login
      order: 100
    model: authentik_flows.flowstagebinding

  # Show "Sign up" on the login page (must keep user_fields or validation fails).
  - model: authentik_stages_identification.identificationstage
    identifiers:
      name: default-authentication-identification
    attrs:
      user_fields:
        - username
        - email
      enrollment_flow: !Find [authentik_flows.flow, [slug, default-enrollment-flow]]
