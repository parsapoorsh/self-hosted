services:
  kiwix:
    build: .
    image: self-hosted-kiwix:local
    container_name: kiwix-serve
    volumes:
      - ./files:/zim:ro
    environment:
      KIWIX_PORT: ${KIWIX_PORT:-9393}
      # Bind address for kiwix-serve -i/--address (empty = all interfaces)
      KIWIX_HOST: ${KIWIX_HOST:-}
      # Parallel threads for kiwix-serve (default: nproc inside the container)
      KIWIX_THREADS: ${KIWIX_THREADS:-}
    # Extra kiwix-serve flags only, e.g.:
    command: ["--urlRootLocation", "/kiwix"]
    networks:
      - self-hosted
    restart: unless-stopped

networks:
  self-hosted:
    name: self-hosted
