# Service constants live in each service dir as `env` (or `*.env`).
# Human settings in `.env`; derived internal secrets in `.env.secrets`
# (run `./scripts/sync-secrets.sh` or `./scripts/compose.sh ...`).
services:
  nginx:
    image: nginx:alpine
    ports:
      # HTTP: host HTTP_PORT -> container :80 (backend Anubis target stays :8080).
      # HTTPS: host HTTPS_PORT == container listen so internal OIDC URLs with
      # HTTPS_PORT_SUFFIX reach nginx (e.g. auth.$DOMAIN:8443).
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./nginx:/etc/nginx/self-hosted:ro
      - ./static:/usr/share/nginx/html:ro
      # cert/<DOMAIN|localhost>/; rw so first start can create cert/localhost
      - ./cert:/etc/nginx/certs
      - nextcloud_html:/var/www/nextcloud:ro
    entrypoint: ["/bin/sh", "/etc/nginx/self-hosted/docker-entrypoint.sh"]
    # auth.* aliases live on nginx (TLS edge) so containers can call
    # https://auth.$DOMAIN for OIDC token/userinfo with correct X-Forwarded-*.
    networks:
      self-hosted:
        aliases:
          - auth.${DOMAIN:-example.com}
          - auth.localhost
    depends_on:
      - anubis
      - authentik
    restart: unless-stopped

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    env_file:
      - ./anubis/env
    volumes:
      - ./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

  kiwix:
    build: ./kiwix
    image: self-hosted-kiwix:local
    env_file:
      - ./kiwix/env
    volumes:
      - ./kiwix/files:/zim:ro
    networks:
      - self-hosted
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./postgres/env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # postgres/init on first empty volume (from .env.secrets)
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      MATTERMOST_DB_PASSWORD: ${MATTERMOST_DB_PASSWORD}
      NEXSPENCE_DB_PASSWORD: ${NEXSPENCE_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nextcloud:
    image: nextcloud:35-fpm
    env_file:
      - ./nextcloud/env
    environment:
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      # Same human admin as Authentik
      NEXTCLOUD_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Both names; do not set OVERWRITEHOST (breaks cloud.localhost).
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${DOMAIN:-example.com} cloud.localhost
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL:-https://cloud.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}}
      DOMAIN: ${DOMAIN:-example.com}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    volumes:
      - nextcloud_html:/var/www/html
      - ./nextcloud/hooks:/docker-entrypoint-hooks.d:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authentik:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

  # Authentik IdP (OIDC + self-registration). Public host is auth.${DOMAIN}.
  # 2026.x needs large /dev/shm (gunicorn socket). Do not set AUTHENTIK_HOST to a
  # full URL - that overwrites listen hostname. Public URL = reverse-proxy Host.
  authentik:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    env_file:
      - ./authentik/env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_DB_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTH_ADMIN_EMAIL:-${KEYCLOAK_ADMIN:-admin}@${DOMAIN:-example.com}}
      # Blueprint env for OIDC client secrets + redirect hosts
      DOMAIN: ${DOMAIN:-example.com}
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      MIRROR_OIDC_CLIENT_SECRET: ${MIRROR_OIDC_CLIENT_SECRET}
      MATTERMOST_OIDC_CLIENT_SECRET: ${MATTERMOST_OIDC_CLIENT_SECRET}
    volumes:
      - authentik_data:/data
      - authentik_templates:/templates
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - self-hosted
    # Required by 2026.x (gunicorn listens on /dev/shm/*.sock).
    shm_size: 512mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    user: root
    env_file:
      - ./authentik/env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTH_DB_PASSWORD}
      DOMAIN: ${DOMAIN:-example.com}
      HTTPS_PORT_SUFFIX: ${HTTPS_PORT_SUFFIX:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      MIRROR_OIDC_CLIENT_SECRET: ${MIRROR_OIDC_CLIENT_SECRET}
      MATTERMOST_OIDC_CLIENT_SECRET: ${MATTERMOST_OIDC_CLIENT_SECRET}
    volumes:
      - authentik_data:/data
      - authentik_templates:/templates
      - authentik_certs:/certs
      - ./authentik/blueprints:/blueprints/custom:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - self-hosted
    shm_size: 512mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 180s

  # Package registry (Nexus-compatible API). Public host is mirror.${DOMAIN}.
  nexspence:
    build: ./nexspence
    image: self-hosted-nexspence:local
    user: "1000:1000"
    entrypoint: ["/bin/bash", "/init/docker-entrypoint.sh"]
    env_file:
      - ./nexspence/env
    environment:
      NEXSPENCE_DATABASE_DSN: postgres://nexspence:${NEXSPENCE_DB_PASSWORD}@postgres:5432/nexspence?sslmode=disable
      NEXSPENCE_HTTP_BASE_URL: https://mirror.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}
      NEXSPENCE_AUTH_JWT_SECRET: ${NEXSPENCE_AUTH_JWT_SECRET}
      # Same human admin as Authentik (bootstrap + basic auth for package/API clients)
      NEXSPENCE_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      NEXSPENCE_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      NEXSPENCE_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      NEXSPENCE_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Authentik OIDC (native UI SSO). Per-app issuer under /application/o/<slug>/.
      NEXSPENCE_OIDC_ISSUER: https://auth.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}/application/o/mirror/
      NEXSPENCE_OIDC_CLIENT_ID: ${MIRROR_OIDC_CLIENT_ID:-mirror}
      NEXSPENCE_OIDC_CLIENT_SECRET: ${MIRROR_OIDC_CLIENT_SECRET}
      NEXSPENCE_OIDC_REDIRECT_URL: https://mirror.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}/api/v1/auth/oidc/callback
      NEXSPENCE_OIDC_FRONTEND_BASE_URL: https://mirror.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}
      NEXSPENCE_OIDC_COOKIE_KEY: ${NEXSPENCE_OIDC_COOKIE_KEY}
    volumes:
      - nexspence_blobs:/app/data/blobs
      - nexspence_secrets:/app/secrets
      - ./nexspence/docker-entrypoint.sh:/init/docker-entrypoint.sh:ro
      - ./nexspence/bootstrap.sh:/init/bootstrap.sh:ro
      - ./nexspence/ensure_repos.py:/init/ensure_repos.py:ro
      - ./nexspence/catalog.json:/init/catalog.json:ro
      # Created by scripts/compose.sh (openssl); used for Alpine repo signing
      - ./cert/alpine.key:/init/alpine.key:ro
    depends_on:
      postgres:
        condition: service_healthy
      authentik:
        condition: service_healthy
    networks:
      - self-hosted
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      # /service/rest/v1/status is auth-gated; auth/config is always public.
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:8081/api/v1/auth/config
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  # Mattermost - Authentik via GitLab SSO (enterprise image; SSO needs license features)
  mattermost:
    image: mattermost/mattermost-enterprise-edition:12.0.1
    env_file:
      - ./mattermost/env
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      MM_SERVICESETTINGS_SITEURL: https://chat.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}
      MM_TEAMSETTINGS_SITENAME: ${ORG_NAME}
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MATTERMOST_DB_PASSWORD}@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_GITLABSETTINGS_ID: ${MATTERMOST_OIDC_CLIENT_ID:-mattermost}
      MM_GITLABSETTINGS_SECRET: ${MATTERMOST_OIDC_CLIENT_SECRET}
      # Shared Authentik OAuth2 endpoints (nginx TLS edge, public HTTPS_PORT).
      MM_GITLABSETTINGS_AUTHENDPOINT: https://auth.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}/application/o/authorize/
      MM_GITLABSETTINGS_TOKENENDPOINT: https://auth.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}/application/o/token/
      MM_GITLABSETTINGS_USERAPIENDPOINT: https://auth.${DOMAIN:-example.com}${HTTPS_PORT_SUFFIX:-}/application/o/userinfo/
      # auth.* resolves to nginx on the compose network (private IP). Mattermost
      # SSRF guard blocks that unless listed here.
      MM_SERVICESETTINGS_ALLOWEDUNTRUSTEDINTERNALCONNECTIONS: auth.${DOMAIN:-example.com} auth.localhost nginx
      # Calls (WebRTC): media is UDP/TCP on CALLS_PORT (not via nginx).
      # ICE host must be a real host IP clients can reach - not chat.$DOMAIN when
      # that resolves to 127.0.0.1 (breaks Docker UDP). compose.sh auto-detects
      # the host primary IPv4 when CALLS_ICE_HOST_OVERRIDE is unset.
      # Listen ports default in mattermost/env; override here when CALLS_PORT is set.
      MM_CALLS_UDP_SERVER_PORT: ${CALLS_PORT:-8443}
      MM_CALLS_TCP_SERVER_PORT: ${CALLS_PORT:-8443}
      MM_CALLS_ICE_HOST_OVERRIDE: ${CALLS_ICE_HOST_OVERRIDE:?set CALLS_ICE_HOST_OVERRIDE or use ./scripts/compose.sh}
      MM_CALLS_ICE_HOST_PORT_OVERRIDE: ${CALLS_PORT:-8443}
    ports:
      # Media path bypasses the reverse proxy (UDP cannot be proxied by nginx).
      - "${CALLS_PORT:-8443}:${CALLS_PORT:-8443}/udp"
      - "${CALLS_PORT:-8443}:${CALLS_PORT:-8443}/tcp"
    volumes:
      - mattermost_config:/mattermost/config
      - mattermost_data:/mattermost/data
      - mattermost_logs:/mattermost/logs
      - mattermost_plugins:/mattermost/plugins
      - mattermost_client_plugins:/mattermost/client/plugins
      - mattermost_bleve:/mattermost/bleve-indexes
    depends_on:
      postgres:
        condition: service_healthy
      authentik:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped
    # Image is minimal (no /bin/sh or curl) - smoke-check probes /api/v4/system/ping.

networks:
  self-hosted:
    name: self-hosted
    enable_ipv6: false

volumes:
  postgres_data:
  nextcloud_html:
  nexspence_blobs:
  nexspence_secrets:
  authentik_data:
  authentik_templates:
  authentik_certs:
  mattermost_config:
  mattermost_data:
  mattermost_logs:
  mattermost_plugins:
  mattermost_client_plugins:
  mattermost_bleve:
