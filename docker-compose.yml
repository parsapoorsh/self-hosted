services:
  nginx:
    image: nginx:alpine
    container_name: self-hosted-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Mount beside the image config so stock mime.types stay available
      - ./nginx:/etc/nginx/self-hosted:ro
      - ./index:/usr/share/nginx/html:ro
      # LE-style tree: cert/<domain>/{fullchain,privkey}.pem — picked by SNI
      - ./cert:/etc/nginx/certs:ro
    command:
      - nginx
      - -g
      - daemon off;
      - -c
      - /etc/nginx/self-hosted/nginx.conf
    networks:
      - self-hosted
    restart: unless-stopped

  # Bot challenge filter: nginx (TLS) → anubis → nginx :8080 (HTTP routing)
  anubis:
    image: ghcr.io/techarohq/anubis:latest
    container_name: self-hosted-anubis
    environment:
      BIND: ":8923"
      TARGET: "http://nginx:8080"
      DIFFICULTY: "${ANUBIS_DIFFICULTY:-4}"
      COOKIE_SECURE: "${ANUBIS_COOKIE_SECURE:-true}"
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

networks:
  self-hosted:
    name: self-hosted
