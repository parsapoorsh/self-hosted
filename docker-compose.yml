# Service constants live in each service dir as `env` (or `*.env`).
# Secrets and host-wide settings live in the project root `.env`.
services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - ./nginx:/etc/nginx/self-hosted:ro
      - ./static:/usr/share/nginx/html:ro
      # cert/<DOMAIN|localhost>/; rw so first start can create cert/localhost
      - ./cert:/etc/nginx/certs
      - nextcloud_html:/var/www/nextcloud:ro
    entrypoint: ["/bin/sh", "/etc/nginx/self-hosted/docker-entrypoint.sh"]
    networks:
      - self-hosted
    depends_on:
      - anubis
      - kiwix
      - keycloak
      - nextcloud
      - nexus
      - nexus-oauth2-proxy
      - nexus-oauth2-local
    restart: unless-stopped

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    env_file:
      - ./anubis/env
    environment:
      COOKIE_SECURE: "${ANUBIS_COOKIE_SECURE:-true}"
    volumes:
      - ./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

  kiwix:
    build: ./kiwix
    image: self-hosted-kiwix:local
    container_name: kiwix-serve
    env_file:
      - ./kiwix/env
    environment:
      KIWIX_PORT: ${KIWIX_PORT:-9393}
      KIWIX_HOST: ${KIWIX_HOST:-}
      KIWIX_THREADS: ${KIWIX_THREADS:-}
    volumes:
      - ./kiwix/files:/zim:ro
    networks:
      - self-hosted
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./postgres/env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # postgres/init on first empty volume
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nextcloud:
    image: nextcloud:35-fpm
    env_file:
      - ./nextcloud/env
    environment:
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${DOMAIN:-example.com}
      OVERWRITEHOST: cloud.${DOMAIN:-example.com}
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL:-${APP_SCHEME:-http}://cloud.${DOMAIN:-example.com}}
      DOMAIN: ${DOMAIN:-example.com}
      APP_SCHEME: ${APP_SCHEME:-http}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-home}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-nextcloud}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-Keycloak}
    volumes:
      - nextcloud_html:/var/www/html
      - ./nextcloud/hooks:/docker-entrypoint-hooks.d:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    entrypoint: ["/bin/bash", "/init/docker-entrypoint.sh"]
    env_file:
      - ./keycloak/env
    environment:
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # bootstrap-realm.sh
      DOMAIN: ${DOMAIN:-example.com}
      APP_SCHEME: ${APP_SCHEME:-http}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-home}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-nextcloud}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      NEXUS_OIDC_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      NEXUS_OIDC_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
    volumes:
      - ./keycloak/docker-entrypoint.sh:/init/docker-entrypoint.sh:ro
      - ./keycloak/bootstrap-realm.sh:/init/bootstrap-realm.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      self-hosted:
        aliases:
          - auth.${DOMAIN:-example.com}
          - auth.localhost
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;
          cat <&3 | grep -q 'UP'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  nexus:
    image: sonatype/nexus3:3.97.3-ubi
    entrypoint: ["/bin/bash", "/init/docker-entrypoint.sh"]
    env_file:
      - ./nexus/env
    environment:
      NEXUS_ADMIN_PASSWORD: ${NEXUS_ADMIN_PASSWORD}
      NEXUS_ADMIN_USER: ${NEXUS_ADMIN_USER:-admin}
    volumes:
      - nexus_data:/nexus-data
      - ./nexus/docker-entrypoint.sh:/init/docker-entrypoint.sh:ro
      - ./nexus/telemetry-sink.py:/init/telemetry-sink.py:ro
      - ./nexus/bootstrap.sh:/init/bootstrap.sh:ro
      - ./nexus/ensure_repos.py:/init/ensure_repos.py:ro
      - ./nexus/catalog.json:/init/catalog.json:ro
    networks:
      - self-hosted
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:8081/service/rest/v1/status
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Nexus UI SSO for nexus.<DOMAIN>
  nexus-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    env_file:
      - ./nexus/oauth2-proxy.env
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${NEXUS_OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "${NEXUS_OAUTH2_COOKIE_SECURE:-false}"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "${NEXUS_OAUTH2_SSL_INSECURE_SKIP_VERIFY:-true}"
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${APP_SCHEME:-http}://auth.${DOMAIN:-example.com}/realms/${KEYCLOAK_REALM:-home}
      OAUTH2_PROXY_LOGIN_URL: ${APP_SCHEME:-http}://auth.${DOMAIN:-example.com}/realms/${KEYCLOAK_REALM:-home}/protocol/openid-connect/auth
      OAUTH2_PROXY_REDIRECT_URL: ${APP_SCHEME:-http}://nexus.${DOMAIN:-example.com}/oauth2/callback
      OAUTH2_PROXY_REDEEM_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-home}/protocol/openid-connect/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-home}/protocol/openid-connect/certs
      OAUTH2_PROXY_PROFILE_URL: http://keycloak:8080/realms/${KEYCLOAK_REALM:-home}/protocol/openid-connect/userinfo
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${DOMAIN:-example.com},${DOMAIN:-example.com}"
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

  # Nexus UI SSO for https://nexus.localhost/
  nexus-oauth2-local:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    env_file:
      - ./nexus/oauth2-local.env
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${NEXUS_OAUTH2_COOKIE_SECRET}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

networks:
  self-hosted:
    name: self-hosted
    enable_ipv6: false

volumes:
  postgres_data:
  nextcloud_html:
  nexus_data:
