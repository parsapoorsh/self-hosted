# Service constants live in each service dir as `env` (or `*.env`).
# Human settings in `.env`; derived internal secrets in `.env.secrets`
# (run `./scripts/sync-secrets.sh` or `./scripts/compose.sh ...`).
services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-example.com}
    volumes:
      - ./nginx:/etc/nginx/self-hosted:ro
      - ./static:/usr/share/nginx/html:ro
      # cert/<DOMAIN|localhost>/; rw so first start can create cert/localhost
      - ./cert:/etc/nginx/certs
      - nextcloud_html:/var/www/nextcloud:ro
    entrypoint: ["/bin/sh", "/etc/nginx/self-hosted/docker-entrypoint.sh"]
    networks:
      - self-hosted
    depends_on:
      - anubis
      - kiwix
      - authelia
      - nextcloud
      - nexus
      - apt-group
      - nexus-oauth2-proxy
      - nexus-oauth2-local
    restart: unless-stopped

  anubis:
    image: ghcr.io/techarohq/anubis:latest
    env_file:
      - ./anubis/env
    environment:
      # false so challenges work on plain HTTP (Secure/Partitioned cookies are HTTPS-only).
      COOKIE_SECURE: "${ANUBIS_COOKIE_SECURE:-false}"
      COOKIE_PARTITIONED: "${ANUBIS_COOKIE_PARTITIONED:-false}"
    volumes:
      - ./anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "anubis", "--healthcheck"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 500ms

  kiwix:
    build: ./kiwix
    image: self-hosted-kiwix:local
    env_file:
      - ./kiwix/env
    environment:
      KIWIX_PORT: ${KIWIX_PORT:-9393}
      KIWIX_HOST: ${KIWIX_HOST:-}
      KIWIX_THREADS: ${KIWIX_THREADS:-}
    volumes:
      - ./kiwix/files:/zim:ro
    networks:
      - self-hosted
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - ./postgres/env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # postgres/init on first empty volume (from .env.secrets)
      NEXTCLOUD_DB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - self-hosted
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nextcloud:
    image: nextcloud:35-fpm
    env_file:
      - ./nextcloud/env
    environment:
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD}
      # Same human admin as Authelia
      NEXTCLOUD_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Both names; do not set OVERWRITEHOST (breaks cloud.localhost).
      NEXTCLOUD_TRUSTED_DOMAINS: cloud.${DOMAIN:-example.com} cloud.localhost
      OVERWRITECLIURL: ${NEXTCLOUD_OVERWRITE_CLI_URL:-${APP_SCHEME:-http}://cloud.${DOMAIN:-example.com}}
      DOMAIN: ${DOMAIN:-example.com}
      APP_SCHEME: ${APP_SCHEME:-http}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-nextcloud}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_PROVIDER_ID: ${OIDC_PROVIDER_ID:-Authelia}
    volumes:
      - nextcloud_html:/var/www/html
      - ./nextcloud/hooks:/docker-entrypoint-hooks.d:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      authelia:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

  authelia:
    image: authelia/authelia:4.38.5
    entrypoint: ["/bin/sh", "/init/docker-entrypoint.sh"]
    env_file:
      - ./authelia/env
    environment:
      DOMAIN: ${DOMAIN:-example.com}
      APP_SCHEME: ${APP_SCHEME:-http}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-nextcloud}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      NEXUS_OIDC_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      NEXUS_OIDC_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      OIDC_HMAC_SECRET: ${OIDC_HMAC_SECRET}
      # Enables /app/healthcheck.sh
      X_AUTHELIA_HEALTHCHECK: "1"
    volumes:
      - ./authelia/docker-entrypoint.sh:/init/docker-entrypoint.sh:ro
      - authelia_data:/data
    networks:
      self-hosted:
        aliases:
          - auth.${DOMAIN:-example.com}
          - auth.localhost
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  nexus:
    image: sonatype/nexus3:3.97.3-ubi
    entrypoint: ["/bin/bash", "/init/docker-entrypoint.sh"]
    env_file:
      - ./nexus/env
    environment:
      # Same human admin as Authelia (local API + Rut Auth username)
      NEXUS_ADMIN_USER: ${KEYCLOAK_ADMIN:-admin}
      NEXUS_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - nexus_data:/nexus-data
      - ./nexus/docker-entrypoint.sh:/init/docker-entrypoint.sh:ro
      - ./nexus/telemetry-sink.py:/init/telemetry-sink.py:ro
      - ./nexus/patch-usage-limit.py:/init/patch-usage-limit.py:ro
      - ./nexus/bootstrap.sh:/init/bootstrap.sh:ro
      - ./nexus/ensure_repos.py:/init/ensure_repos.py:ro
      - ./nexus/catalog.json:/init/catalog.json:ro
      # Created by scripts/compose.sh (openssl); used for Alpine repo signing
      - ./cert/alpine.key:/init/alpine.key:ro
    networks:
      - self-hosted
    # Ceiling above INSTALL4J heap+direct in nexus/env (~1.3g budget).
    mem_limit: 1536m
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://127.0.0.1:8081/service/rest/v1/status
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  # Merged APT archive over Nexus apt proxies (single /repository/apt URL).
  apt-group:
    build: ./apt-group
    environment:
      APT_GROUP_LISTEN: 0.0.0.0:8080
      APT_GROUP_NEXUS_URL: http://nexus:8081
      APT_GROUP_CATALOG: /init/catalog.json
      APT_GROUP_KEYS_DIR: /keys
      APT_GROUP_CACHE_DIR: /var/cache/apt-group
      APT_GROUP_LOG: INFO
    volumes:
      - ./nexus/catalog.json:/init/catalog.json:ro
      - ./cert/apt-group:/keys
      - apt_group_cache:/var/cache/apt-group
    depends_on:
      nexus:
        condition: service_healthy
    networks:
      - self-hosted
    mem_limit: 1536m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sf http://127.0.0.1:8080/healthz || exit 1
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Nexus UI SSO for nexus.<DOMAIN> (Authelia OIDC via oauth2-proxy + Rut Auth)
  nexus-oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    env_file:
      - ./nexus/oauth2-proxy.env
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${NEXUS_OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "${NEXUS_OAUTH2_COOKIE_SECURE:-true}"
      OAUTH2_PROXY_SSL_INSECURE_SKIP_VERIFY: "${NEXUS_OAUTH2_SSL_INSECURE_SKIP_VERIFY:-true}"
      # Issuer is always https (Authelia session cookies require TLS).
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://auth.${DOMAIN:-example.com}
      OAUTH2_PROXY_LOGIN_URL: https://auth.${DOMAIN:-example.com}/api/oidc/authorization
      OAUTH2_PROXY_REDIRECT_URL: ${APP_SCHEME:-http}://nexus.${DOMAIN:-example.com}/oauth2/callback
      OAUTH2_PROXY_REDEEM_URL: http://authelia:9091/api/oidc/token
      OAUTH2_PROXY_OIDC_JWKS_URL: http://authelia:9091/jwks.json
      OAUTH2_PROXY_PROFILE_URL: http://authelia:9091/api/oidc/userinfo
      OAUTH2_PROXY_WHITELIST_DOMAINS: ".${DOMAIN:-example.com},${DOMAIN:-example.com}"
    depends_on:
      authelia:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

  # Nexus UI SSO for https://nexus.localhost/
  nexus-oauth2-local:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    env_file:
      - ./nexus/oauth2-local.env
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${NEXUS_OIDC_CLIENT_ID:-nexus}
      OAUTH2_PROXY_CLIENT_SECRET: ${NEXUS_OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${NEXUS_OAUTH2_COOKIE_SECRET}
    depends_on:
      authelia:
        condition: service_healthy
    networks:
      - self-hosted
    restart: unless-stopped

networks:
  self-hosted:
    name: self-hosted
    enable_ipv6: false

volumes:
  postgres_data:
  nextcloud_html:
  nexus_data:
  apt_group_cache:
  authelia_data:
