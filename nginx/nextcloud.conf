# Included by the cloud.<DOMAIN> edge server. Serves Nextcloud static files and
# FastCGI to the nextcloud PHP-FPM container (no extra nginx process).
#
# Edge mount:  nextcloud_html -> /var/www/nextcloud  (app-specific; leave /var/www/html free)
# FPM mount:   nextcloud_html -> /var/www/html      (stock Nextcloud image path)
# SCRIPT_FILENAME is rewritten to the FPM path below.

root /var/www/nextcloud;
index index.php index.html /index.php$request_uri;

# Large uploads / WebDAV (also set on the server block)
client_body_timeout 3600s;

location = /robots.txt {
    allow all;
    log_not_found off;
    access_log off;
}

location ^~ /.well-known {
    location = /.well-known/carddav { return 301 /remote.php/dav/; }
    location = /.well-known/caldav  { return 301 /remote.php/dav/; }
    location ^~ /.well-known/acme-challenge    { try_files $uri $uri/ =404; }
    location ^~ /.well-known/pki-validation    { try_files $uri $uri/ =404; }
    return 301 /index.php$request_uri;
}

location / {
    try_files $uri $uri/ /index.php$request_uri;
}

# PHP-FPM (hostname re-resolved via http.conf resolver)
location ~ \.php(?:$|/) {
    rewrite ^/(?!index|remote|public|cron|core\/ajax\/update|status|ocs\/v[12]|updater\/.+|oc[ms]-provider\/.+|.+\/richdocumentscode(_arm64)?\/proxy) /index.php$request_uri;

    fastcgi_split_path_info ^(.+?\.php)(/.*)$;
    set $path_info $fastcgi_path_info;
    try_files $fastcgi_script_name =404;

    # Absolute path: relative includes resolve next to this file, not the image conf.
    include /etc/nginx/fastcgi_params;
    # Map edge root (/var/www/nextcloud) -> FPM root (/var/www/html)
    fastcgi_param DOCUMENT_ROOT /var/www/html;
    fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
    fastcgi_param PATH_INFO $path_info;
    # Follow edge scheme so http://cloud.localhost works without forced HTTPS.
    fastcgi_param HTTPS $fcgi_https;
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    fastcgi_param HTTP_X_FORWARDED_HOST $host;
    fastcgi_param modHeadersAvailable true;
    fastcgi_param front_controller_active true;

    set $nextcloud_fpm nextcloud:9000;
    fastcgi_pass $nextcloud_fpm;

    fastcgi_intercept_errors on;
    fastcgi_request_buffering off;
    fastcgi_read_timeout 3600s;
    fastcgi_send_timeout 3600s;
    fastcgi_buffers 64 4k;
}

location ~ \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
    try_files $uri /index.php$request_uri;
    expires 6M;
    access_log off;
}

location ~ \.woff2?$ {
    try_files $uri /index.php$request_uri;
    expires 7d;
    access_log off;
}

location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) { return 404; }
location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) { return 404; }
