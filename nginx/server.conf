# One server for HTTP + HTTPS. TLS cert is chosen from SNI at handshake:
#   /etc/nginx/certs/<sni-hostname>/fullchain.pem
#   /etc/nginx/certs/<sni-hostname>/privkey.pem
# Matches the cert/<domain>/ tree
# No domains are hardcoded

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Variable paths: loaded per-handshake from the SNI name the client sends.
    ssl_certificate     /etc/nginx/certs/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name/privkey.pem;

    # Landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Kiwix offline library
    location /kiwix {
        set $kiwix_upstream http://kiwix-serve:9393;
        proxy_pass $kiwix_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
