# One public server for HTTP + HTTPS. TLS cert is chosen from SNI at handshake:
#   /etc/nginx/certs/<sni-hostname>/fullchain.pem
#   /etc/nginx/certs/<sni-hostname>/privkey.pem
# Matches the cert/<domain>/ tree
# No domains are hardcoded
#
# Flow: client -> this edge server -> Anubis -> backend server :8080

# Edge: TLS termination + proxy everything through Anubis
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    # Variable paths: loaded per-handshake from the SNI name the client sends.
    ssl_certificate     /etc/nginx/certs/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/$ssl_server_name/privkey.pem;

    # Restore client IP from Cloudflare (CF-Connecting-IP)
    include /etc/nginx/self-hosted/cloudflare.conf;

    location / {
        set $anubis_upstream http://anubis:8923;
        proxy_pass $anubis_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Http-Version $server_protocol;
        proxy_set_header X-TLS-SNI-Name $ssl_server_name;
        proxy_set_header Connection "";
        # Challenge pages and large library payloads
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Backend: HTTP routing only (Anubis TARGET). Not published to the host.
server {
    listen 8080;
    server_name _;

    # Client IP is forwarded by the edge server via Anubis
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # Landing page
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Kiwix offline library
    location /kiwix {
        set $kiwix_upstream http://kiwix-serve:9393;
        proxy_pass $kiwix_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}
