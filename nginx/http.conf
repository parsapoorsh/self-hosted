# mime.types comes from the nginx image
include /etc/nginx/mime.types;
# Nextcloud ships ES modules as .mjs; stock alpine mime.types omit it
# (browsers refuse type=module when Content-Type is application/octet-stream).
types {
    application/javascript mjs;
}
default_type application/octet-stream;
sendfile on;
keepalive_timeout 65;

# Docker DNS so upstreams re-resolve when containers restart
resolver 127.0.0.11 valid=10s ipv6=off;

# Shared TLS defaults (cert paths live in server.conf, driven by SNI)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Nextcloud FastCGI: scheme -> HTTPS on/off
map $scheme $fcgi_https {
    default off;
    https on;
}

# SNI/host -> cert dir and nexus oauth2 upstream (rendered by docker-entrypoint.sh)
include /etc/nginx/self-hosted-runtime/snippets/cert-map.conf;

# Rendered at start by docker-entrypoint.sh from server.conf.template
include /etc/nginx/self-hosted-runtime/server.conf;
