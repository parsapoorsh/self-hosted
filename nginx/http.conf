# mime.types comes from the nginx image
include /etc/nginx/mime.types;
default_type application/octet-stream;

sendfile on;
keepalive_timeout 65;

# Docker DNS so upstreams re-resolve when containers restart
resolver 127.0.0.11 valid=10s ipv6=off;

# Shared TLS defaults (cert paths live in server.conf, driven by SNI)
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

include /etc/nginx/self-hosted/server.conf;
