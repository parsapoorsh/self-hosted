# Proxy to Authentik (auth edge). Include inside auth server blocks.
# map $connection_upgrade is defined in http.conf (upgrade when client upgrades).
location / {
    set $authentik_upstream http://authentik:9000;
    proxy_pass $authentik_upstream;
    proxy_http_version 1.1;
    # $http_host keeps non-default ports so OIDC issuer URLs match the browser.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # WebSocket (Authentik /ws/client/) needs Upgrade + Connection: upgrade.
    # Empty Connection broke wss handshake (HTTP 200 instead of 101).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_read_timeout 86400s;
}
