# Shared Nexus edge locations (included inside each nexus server block).
# Named locations are per-server, so HTTP and HTTPS can both include this.

client_max_body_size 0;
proxy_request_buffering off;

# oauth2-proxy (Authelia OIDC) — $nexus_oauth2_upstream from cert-map (DOMAIN vs localhost).
location /oauth2/ {
    proxy_pass $nexus_oauth2_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
    proxy_set_header Connection "";
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

location = /oauth2/auth {
    proxy_pass $nexus_oauth2_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_pass_request_body off;
    proxy_pass_request_headers on;
}

# Package / Docker registry: Nexus handles basic auth / tokens (no OIDC gate).
location ~ ^/(repository|v2)/ {
    set $nexus_upstream http://nexus:8081;
    proxy_pass $nexus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# REST API: Rut Auth when Authelia session exists; else basic auth / anonymous.
location /service/rest/ {
    auth_request /oauth2/auth;
    auth_request_set $auth_user $upstream_http_x_auth_request_preferred_username;
    error_page 401 = @nexus_rest_nosso;

    set $nexus_upstream http://nexus:8081;
    proxy_pass $nexus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User $auth_user;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location @nexus_rest_nosso {
    set $nexus_upstream http://nexus:8081;
    proxy_pass $nexus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# UI: require Authelia session, pass preferred_username to Nexus Rut Auth.
location / {
    auth_request /oauth2/auth;
    error_page 401 = @nexus_oidc_signin;

    auth_request_set $auth_user $upstream_http_x_auth_request_preferred_username;
    auth_request_set $auth_email $upstream_http_x_auth_request_email;

    set $nexus_upstream http://nexus:8081;
    proxy_pass $nexus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Remote-User $auth_user;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}

location @nexus_oidc_signin {
    set $rd_escape $request_uri;
    return 302 /oauth2/start?rd=$scheme://$host$rd_escape;
}
