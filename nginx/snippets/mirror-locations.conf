# Shared package-registry edge locations (public host mirror.* -> Nexspence).
# Named locations are per-server, so HTTP and HTTPS can both include this.

client_max_body_size 0;
proxy_request_buffering off;

# Package / Docker registry: Nexspence basic auth / anonymous (no OIDC gate).
location ~ ^/(repository|v2)/ {
    set $nexspence_upstream http://nexspence:8081;
    proxy_pass $nexspence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# UI + REST + native OIDC callback. SSO is Nexspence -> Authelia (not oauth2-proxy).
location / {
    set $nexspence_upstream http://nexspence:8081;
    proxy_pass $nexspence_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
}
