# Single Anubis reverse-proxy location (edge -> anubis:8923 -> backend :8080).
location / {
    set $anubis_upstream http://anubis:8923;
    proxy_pass $anubis_upstream;
    proxy_http_version 1.1;
    # Host must match TLS SNI (hostname only). $http_host includes :HTTPS_PORT
    # and trips Anubis bot/domain-fronting (error 10ec3b68893254cc).
    # Public port is still available via X-Forwarded-Port.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Http-Version $server_protocol;
    proxy_set_header X-TLS-SNI-Name $ssl_server_name;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
}
