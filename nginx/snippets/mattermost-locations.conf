# Proxy Mattermost app (websocket + HTTP). Upstream via Docker DNS.
# Include inside the mattermost server block.

set $mattermost_upstream http://mattermost:8065;

# Websocket (api/v4 and legacy paths)
location ~ /api/v[0-9]+/(users/)?websocket$ {
    proxy_pass $mattermost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 50M;
    proxy_read_timeout 90s;
    proxy_send_timeout 300s;
    proxy_buffers 256 16k;
    proxy_buffer_size 16k;
}

location / {
    proxy_pass $mattermost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_buffers 256 16k;
    proxy_buffer_size 16k;
}
