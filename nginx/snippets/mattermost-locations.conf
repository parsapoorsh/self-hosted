# Proxy Mattermost app (websocket + HTTP). Upstream via Docker DNS.
# Include inside the chat.* server block.

set $mattermost_upstream http://mattermost:8065;

# Websocket (api/v4 and legacy paths)
location ~ /api/v[0-9]+/(users/)?websocket$ {
    proxy_pass $mattermost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 50M;
    proxy_read_timeout 90s;
    proxy_send_timeout 300s;
    proxy_buffers 256 16k;
    proxy_buffer_size 16k;
}

# Mattermost #33801: OAuth login rejects relative redirect_to (e.g. /team/channels/...).
# Expand path-only values to absolute SiteURL. Leading / or %2F stripped once.
# https://github.com/mattermost/mattermost/issues/33801
location ~ ^/oauth/[A-Za-z0-9]+/(login|signup|mobile_login)$ {
    # redirect_to=%2Fteam%2Fchannels%2F...  (common from login?redirect_to=)
    if ($arg_redirect_to ~* "^%2[Ff]+(.*)$") {
        return 302 $scheme://$http_host$uri?redirect_to=$scheme://$http_host/$1;
    }
    # redirect_to=/team/channels/...
    if ($arg_redirect_to ~ "^/+(.*)$") {
        return 302 $scheme://$http_host$uri?redirect_to=$scheme://$http_host/$1;
    }

    proxy_pass $mattermost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_buffers 256 16k;
    proxy_buffer_size 16k;
}

location / {
    proxy_pass $mattermost_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Frame-Options SAMEORIGIN;
    client_max_body_size 50M;
    proxy_read_timeout 600s;
    proxy_buffers 256 16k;
    proxy_buffer_size 16k;
}
