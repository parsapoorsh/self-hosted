# OIDC applications for Nextcloud, Nexspence (mirror), Mattermost.
# Client secrets and redirect host come from env on the Authentik worker.
version: 1
metadata:
  name: self-hosted - OIDC apps
entries:
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: false
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: false

  # --- Nextcloud ---
  - id: provider-nextcloud
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Nextcloud
    attrs:
      name: Nextcloud
      client_type: confidential
      client_id: nextcloud
      client_secret: !Env OIDC_CLIENT_SECRET
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
      sub_mode: user_username
      include_claims_in_id_token: true
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: !Format
            - "https://cloud.%s%s/apps/user_oidc/code"
            - !Env DOMAIN
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://cloud.%s%s/index.php/apps/user_oidc/code"
            - !Env DOMAIN
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://cloud.localhost%s/apps/user_oidc/code"
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://cloud.localhost%s/index.php/apps/user_oidc/code"
            - !Env HTTPS_PORT_SUFFIX

  - model: authentik_core.application
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      slug: nextcloud
      group: self-hosted
      policy_engine_mode: any
      provider: !KeyOf provider-nextcloud

  # --- Nexspence (mirror) ---
  - id: provider-mirror
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Nexspence
    attrs:
      name: Nexspence
      client_type: confidential
      client_id: mirror
      client_secret: !Env MIRROR_OIDC_CLIENT_SECRET
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
      sub_mode: user_username
      include_claims_in_id_token: true
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: !Format
            - "https://mirror.%s%s/api/v1/auth/oidc/callback"
            - !Env DOMAIN
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://mirror.localhost%s/api/v1/auth/oidc/callback"
            - !Env HTTPS_PORT_SUFFIX

  - model: authentik_core.application
    identifiers:
      slug: mirror
    attrs:
      name: Nexspence
      slug: mirror
      group: self-hosted
      policy_engine_mode: any
      provider: !KeyOf provider-mirror

  # --- Mattermost (GitLab OIDC settings) ---
  - id: provider-mattermost
    model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: Mattermost
    attrs:
      name: Mattermost
      client_type: confidential
      client_id: mattermost
      client_secret: !Env MATTERMOST_OIDC_CLIENT_SECRET
      authorization_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-authorization-implicit-consent]
      invalidation_flow: !Find
        - authentik_flows.flow
        - [slug, default-provider-invalidation-flow]
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-openid]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-email]
        - !Find
          - authentik_providers_oauth2.scopemapping
          - [managed, goauthentik.io/providers/oauth2/scope-profile]
      sub_mode: user_username
      include_claims_in_id_token: true
      issuer_mode: per_provider
      redirect_uris:
        - matching_mode: strict
          url: !Format
            - "https://chat.%s%s/signup/gitlab/complete"
            - !Env DOMAIN
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://chat.%s%s/login/gitlab/complete"
            - !Env DOMAIN
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://chat.localhost%s/signup/gitlab/complete"
            - !Env HTTPS_PORT_SUFFIX
        - matching_mode: strict
          url: !Format
            - "https://chat.localhost%s/login/gitlab/complete"
            - !Env HTTPS_PORT_SUFFIX

  - model: authentik_core.application
    identifiers:
      slug: mattermost
    attrs:
      name: Mattermost
      slug: mattermost
      group: self-hosted
      policy_engine_mode: any
      provider: !KeyOf provider-mattermost
